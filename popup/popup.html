<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" data-tab="captured">Captured</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </div>

  <div id="captured" class="panel active">
    <h2>Captured Data <button id="clear-captured-btn" class="del-btn" style="float:right;">Clear All</button></h2>
    <div id="captured-list"></div>
    <div id="no-data">No data captured yet.</div>
  </div>

  <div id="settings" class="panel">
    <h2>Network Auto-Copy Rules</h2>
    <div id="network-rules-list"></div>
    <div style="background: var(--surface0); padding: 10px; margin-top: 10px; border: 1px solid var(--surface1);">
      <label>Rule Name</label>
      <input type="text" id="net-name" placeholder="e.g. AWS SAML">
      <label>URL Regex (Trigger)</label>
      <input type="text" id="net-url" placeholder="signin.aws.amazon.com">
      <label>Body Regex (Capture Group 1)</label>
      <input type="text" id="net-regex" placeholder="SAMLResponse=([^&]+)">
      <button class="add-btn" id="add-net-btn">Add Network Rule</button>
    </div>

    <h2 style="margin-top: 20px;">Storage Extraction Rules</h2>
    <div id="storage-rules-list"></div>
    <div style="background: var(--surface0); padding: 10px; margin-top: 10px; border: 1px solid var(--surface1);">
      <label>Rule Name</label>
      <input type="text" id="store-name" placeholder="e.g. Session Token">
      <label>URL Regex (Trigger)</label>
      <input type="text" id="store-url" placeholder="mywebsite.com">
      <label>Key Name</label>
      <input type="text" id="store-key" placeholder="auth_token">
      <button class="add-btn" id="add-store-btn">Add Storage Rule</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
